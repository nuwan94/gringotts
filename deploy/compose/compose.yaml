# Local infrastructure for Gringotts. Services run on the host (./gradlew bootRun) or in kind;
# this file only provides what they depend on.
#
#   docker compose -f deploy/compose/compose.yaml up -d                          # core
#   docker compose -f deploy/compose/compose.yaml --profile observability up -d  # + Grafana LGTM
#   docker compose -f deploy/compose/compose.yaml --profile tools up -d          # + Kafka UI
#
# Every credential here is a local-development value. Real environments get secrets from Vault.

name: gringotts

services:

  postgres:
    image: postgres:18.6-alpine
    command:
      - postgres
      - -c
      - wal_level=logical          # required by Debezium
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GRINGOTTS_DATABASES: wizard_registry account ledger transfer exchange vault fraud notification
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: gR1ngott5-Vau1t-713-Aw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Convenient locally; in Kubernetes topics are declared explicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8085:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Kafka Connect with Debezium: relays each service's outbox_event table to Kafka.
  # Connectors are registered per service from deploy/compose/debezium/.
  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: gringotts-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/gringotts-realm.json:/opt/keycloak/data/import/gringotts-realm.json:ro
    healthcheck:
      # The image has no curl; probe the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30

  # Catches every email the notification service sends ("Owl Post"). UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"
      - "1025:1025"

  # Grafana + Prometheus + Loki + Tempo + OpenTelemetry collector in one container.
  # Services export OTLP to localhost:4317 (gRPC) / 4318 (HTTP). Grafana on :3000.
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [observability]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: gringotts
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "8090:8080"

volumes:
  postgres-data:
  kafka-data:
